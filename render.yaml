services:
  - type: web
    name: alvapay-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ALVAPAY_REQUIRE_TURSO
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
